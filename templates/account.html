<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원정보 | AI-Marine Shop</title><link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/account.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a><header id="site-header" class="site-header"></header>
  <main id="main" class="shell">
    <div class="page-heading"><p class="eyebrow">마이페이지</p><h1>회원정보</h1><p class="muted">배송 정보와 비밀번호를 관리하세요.</p></div>
    <div id="page-message" role="status" aria-live="polite" hidden></div>
    <p id="account-loading" class="loading" role="status">회원정보를 불러오는 중입니다.</p>
    <div id="account-content" class="account-grid" hidden>
      <aside class="panel"><h2 id="member-name">나의 계정</h2><p id="member-email" class="muted address"></p><a class="button secondary full" href="/purchases">구매내역 보기</a></aside>
      <div class="account-main stack">
        <section class="panel"><h2>기본 정보</h2>
          <div id="profile-message" role="status" aria-live="polite" hidden></div>
          <form id="profile-form">
            <div class="field"><label for="name">이름</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
            <div class="field"><label for="phone">연락처</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required></div>
            <div class="field"><label for="address">주소</label><input id="address" name="address" autocomplete="street-address" maxlength="500" required></div>
            <button class="button" type="submit">변경사항 저장</button>
          </form>
        </section>
        <section class="panel"><h2>비밀번호 변경</h2><p class="hint">변경 후 모든 기기의 로그인이 해제됩니다.</p>
          <div id="password-message" role="status" aria-live="polite" hidden></div>
          <form id="password-form">
            <div class="field"><label for="current-password">현재 비밀번호</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" maxlength="72" required></div>
            <div class="field"><label for="new-password">새 비밀번호</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="new-password-hint" required><p id="new-password-hint" class="hint">8자 이상, UTF-8 기준 72바이트 이하</p></div>
            <div class="field"><label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
            <button class="button secondary" type="submit">비밀번호 변경</button>
          </form>
        </section>
        <section class="panel danger-zone"><h2>회원 탈퇴</h2><p class="muted">탈퇴하면 로그인할 수 없습니다. 기존 주문·결제 기록은 보존되며, 같은 이메일로 다시 가입할 수 없습니다.</p>
          <div id="delete-message" role="status" aria-live="polite" hidden></div>
          <form id="delete-form">
            <div class="field"><label for="delete-password">현재 비밀번호</label><input id="delete-password" name="current_password" type="password" autocomplete="current-password" maxlength="72" required></div>
            <label class="check-label"><input name="confirmed" type="checkbox" required>안내를 확인했으며 탈퇴하겠습니다.</label>
            <button class="button danger" type="submit">회원 탈퇴</button>
          </form>
        </section>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer><div id="site-navigation"></div>
</body>
</html>
