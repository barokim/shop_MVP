<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | AI-Marine Shop</title><link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/auth.js"></script>
</head>
<body data-page="signup">
  <a class="skip-link" href="#main">본문 바로가기</a><header id="site-header" class="site-header"></header>
  <main id="main" class="shell">
    <div class="auth-wrap">
      <div class="page-heading"><p class="eyebrow">AI-Marine Shop에 오신 것을 환영합니다</p><h1>함께하는 첫걸음.</h1><p class="muted">배송에 필요한 회원정보를 입력해주세요.</p></div>
      <div id="page-message" role="status" aria-live="polite" hidden></div>
      <form id="signup-form" class="panel auth-panel">
        <div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required></div>
        <div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-hint" required><p id="password-hint" class="hint">8자 이상, UTF-8 기준 72바이트 이하로 입력해주세요.</p></div>
        <div class="field"><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
        <div class="field"><label for="name">이름</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
        <div class="field"><label for="phone">연락처</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required></div>
        <div class="field"><label for="address">주소</label><input id="address" name="address" autocomplete="street-address" maxlength="500" placeholder="상세주소까지 입력해주세요" required></div>
        <button class="button full" type="submit">회원가입</button><p class="auth-footer">이미 회원이신가요? <a href="/login">로그인</a></p>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer><div id="site-navigation"></div>
</body>
</html>
